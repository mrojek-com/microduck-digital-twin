name: MicroDuck Digital Twin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python 50Hz Kinematics, Safety & Bridge Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m py_compile src/*.py tests/*.py
      - name: Run pytest suite
        run: pytest -v tests/

  js-kinematics-tests:
    name: JS Kinematics & Safety Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check web/simulator.js
        run: node --check web/simulator.js
      - name: Run Node kinematics & invariant tests
        run: node --test tests/js/*.test.js
